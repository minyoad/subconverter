version = 1

#==========================================================
# AI 服务分流 + 按地区自动切换（美国 / 新加坡）—— TOML 版 叠加版
#
# 本文件已通过 pref 的 default_external_config 自动生效，
# 无需在 URL 里再写 &config=config/AI_auto.toml
#
# 设计要点：本配置是「叠加」而非「替换」
#   内置策略组 / 规则集通过 import 引入，所以广告拦截、
#   B站、Netflix、YouTube 等原有规则全部保留，
#   只是在这个基础上多出 AI 相关策略组与分流规则。
#
# 注意：TOML 外部配置必须有 version = 1，
#       [custom] 放设置，[[custom_groups]] / [[rulesets]] 放根级
# 规则文件位于 base/rules/（base_path=base）
# 与 AI_auto.ini 语义等价，二者选其一即可
#==========================================================

[custom]
enable_rule_generator = true
overwrite_original_rules = false
clash_rule_base = "base/all_base.tpl"

# 节点过滤：排除机场塞进订阅里的"剩余流量/到期时间"等信息节点
# 注意：外部配置里的 exclude_remarks 会「替换」pref 中的全局设置，
#      所以这里保留了 pref 默认的 (到期|剩余流量|时间|官网|产品|平台)，
#      再补上距离/重置/套餐 等更严格的项，避免反而放宽过滤。
exclude_remarks = ["(距离|剩余|重置|流量|到期|过期|官网|套餐|时间|产品|平台|expire|traffic)"]

#----------------------------------------------------------
# 一、内置策略组（🔰 节点选择 / ♻️ 自动选择 / 🌏 国内媒体 ...）
#    AI 组末尾的兜底引用的是内置的 🔰 节点选择
#----------------------------------------------------------
[[custom_groups]]
import = "snippets/groups.toml"

#----------------------------------------------------------
# 二、地区自动测速组
#    只放该地区节点，客户端自动选延迟最低的
#    刻意保持纯净：不要加 []🔰 节点选择 之类兜底，
#    否则 url-test 会退化成"全球最低延迟"，地区筛选失效
#    兜底放在第三节的顶层 select 组
#
# ⚠ 已知限制（subconverter 上游行为，不是本配置的问题）：
#    Clash 目标下若某组一个节点都没匹配到，subexport.cpp 会强制填入 DIRECT。
#    所以地区正则没命中时，这两个组会显示为 DIRECT。
#    此时请把 AI 组手动切到 🔰 节点选择，避免 AI 流量走直连。
#----------------------------------------------------------
[[custom_groups]]
name = "🇺🇸 美国自动"
type = "url-test"
rule = ["(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn)"]
# 想更贴近 ChatGPT 连通性可改为 https://chatgpt.com/cdn-cgi/trace
url = "http://www.gstatic.com/generate_204"
interval = 300
timeout = 5
tolerance = 150

[[custom_groups]]
name = "🇸🇬 新加坡自动"
type = "url-test"
rule = ["(?i)(新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)"]
url = "http://www.gstatic.com/generate_204"
interval = 300
timeout = 5
tolerance = 150

#----------------------------------------------------------
# 三、AI 顶层策略组（[] 前缀 = 引用其它策略组）
#    []🇺🇸 美国自动 / []🇸🇬 新加坡自动 = 引用上面的自动测速组
#    末尾的 []🔰 节点选择 是兜底：万一美/新组都为空（节点没命名匹配上），
#      这里仍有可用节点，不会退化成 DIRECT 直接暴露真实 IP
#    地区自动组刻意保持纯净，不放兜底，否则 url-test 会退化成"全球最低延迟"
#----------------------------------------------------------
[[custom_groups]]
name = "🤖 OpenAI"
type = "select"
rule = [
    "[]🇺🇸 美国自动",
    "[]🇸🇬 新加坡自动",
    "(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)",
    "[]🔰 节点选择"
]

[[custom_groups]]
name = "🎭 Claude"
type = "select"
rule = [
    "[]🇺🇸 美国自动",
    "[]🇸🇬 新加坡自动",
    "(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)",
    "[]🔰 节点选择"
]

[[custom_groups]]
name = "🎬 Muse"
type = "select"
rule = [
    "[]🇺🇸 美国自动",
    "[]🇸🇬 新加坡自动",
    "(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)",
    "[]🔰 节点选择"
]

[[custom_groups]]
name = "🧠 其它 AI"
type = "select"
rule = [
    "[]🇺🇸 美国自动",
    "[]🇸🇬 新加坡自动",
    "(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)",
    "[]🔰 节点选择"
]

#----------------------------------------------------------
# 四、分流规则（顺序即优先级，AI 规则必须排在 GEOIP,CN 与 FINAL 之前）
#    AI 规则在前，内置规则集通过 import 接在后面
#----------------------------------------------------------
[[rulesets]]
group = "🤖 OpenAI"
ruleset = "rules/OpenAI.list"

[[rulesets]]
group = "🎭 Claude"
ruleset = "rules/Claude.list"

[[rulesets]]
group = "🎬 Muse"
ruleset = "rules/Muse.list"

[[rulesets]]
group = "🧠 其它 AI"
ruleset = "rules/AI.list"

[[rulesets]]
import = "snippets/rulesets.toml"
