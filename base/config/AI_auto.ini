[custom]
;==========================================================
; AI 服务分流 + 按地区自动切换（美国 / 新加坡）—— 叠加版
;
; 本文件已通过 pref 的 default_external_config 自动生效，
; 无需在 URL 里再写 &config=config/AI_auto.ini
;
; 设计要点：本配置是「叠加」而非「替换」
;   内置策略组 / 规则集通过 !!import: 引入，所以广告拦截、
;   B站、Netflix、YouTube 等原有规则全部保留，
;   只是在这个基础上多出 AI 相关策略组与分流规则。
;
; 组顺序说明：被引用的组写在前面，引用方写在后面，
;             这样 Clash / Surge / Loon 都能正常解析。
;==========================================================

enable_rule_generator=true
overwrite_original_rules=false
clash_rule_base=base/all_base.tpl

;----------------------------------------------------------
; 节点过滤：排除机场塞进订阅里的"剩余流量/到期时间"等信息节点
; 若不写这一项，这些假节点会被 .* 收进节点选择组，
; 甚至可能被地区正则误命中进 AI 组
; 注意：外部配置里的 exclude_remarks 会「替换」pref 中的全局设置，
;      所以这里保留了 pref 默认的 (到期|剩余流量|时间|官网|产品|平台)，
;      再补上距离/重置/套餐 等更严格的项，避免反而放宽过滤。
;----------------------------------------------------------
exclude_remarks=(距离|剩余|重置|流量|到期|过期|官网|套餐|时间|产品|平台|expire|traffic)

;----------------------------------------------------------
; 一、内置策略组（🔰 节点选择 / ♻️ 自动选择 / 🌏 国内媒体 ...）
;     AI 组末尾的兜底引用的是内置的 🔰 节点选择
;----------------------------------------------------------
custom_proxy_group=!!import:snippets/groups.txt

;----------------------------------------------------------
; 二、地区自动测速组
;     只把该地区节点放进组内，客户端自动选延迟最低的那个
;----------------------------------------------------------
; 正则说明：
;   (?i)               忽略大小写（PCRE2 内联修饰符）
;   (^|[^a-zA-Z])US    US 前面不能紧跟字母，避免 AUS(澳洲)/RUS(俄罗斯) 误匹配；
;                      US01、US-Seattle、美国-洛杉矶 都能命中
; 请按你机场实际的节点命名增删关键词
;
; 测速 URL 说明：
;   默认用 gstatic/generate_204 —— 全球大部分地区都能稳定返回 204，不会误判节点失效
;   想更贴近 ChatGPT 实际连通性，可换成 https://chatgpt.com/cdn-cgi/trace
;   （注意：该地址只探测到 Cloudflare 边缘是否通，并不能判断账号风控地区）
;
; 注意：这里刻意保持"纯净"，只放该地区节点。
;   不要在 url-test 组里加 []🔰 节点选择 之类的兜底组，
;   否则组内会包含所有节点，url-test 就退化成"全球最低延迟"，地区筛选失效。
;   兜底放在下面第三节的顶层 select 组里。
;
; ⚠ 已知限制（subconverter 上游行为，不是本配置的问题）：
;   Clash 目标下，若某组最终一个节点都没匹配到，subexport.cpp 会强制填入 DIRECT。
;   也就是说地区正则没命中时，🇺🇸 美国自动 / 🇸🇬 新加坡自动 会显示为 DIRECT。
;   此时 AI 顶层组的末尾兜底 []🔰 节点选择 才有意义 —— 请在客户端把 AI 组
;   手动切到 🔰 节点选择，避免 AI 流量走直连。
;   排查方法：看生成结果里这两个组是否只有 DIRECT；若是，说明节点名没被正则命中。
custom_proxy_group=🇺🇸 美国自动`url-test`(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn)`http://www.gstatic.com/generate_204`300,5,150
custom_proxy_group=🇸🇬 新加坡自动`url-test`(?i)(新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)`http://www.gstatic.com/generate_204`300,5,150

;----------------------------------------------------------
; 三、AI 顶层策略组（分流规则真正指向这些组）
;     []🇺🇸 美国自动 / []🇸🇬 新加坡自动 = 引用上面的自动测速组
;     最后一段正则 = 把美/新节点也列进组内，便于客户端手动指定单个节点
;     末尾的 []🔰 节点选择 是兜底：万一美/新组都为空（节点没匹配上），
;       这里仍有可用节点，不会退化成 DIRECT 直接暴露真实 IP
;     若想让某个 AI 只走一个国家，把不需要的 [] 引用删掉即可
;----------------------------------------------------------
custom_proxy_group=🤖 OpenAI`select`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)`[]🔰 节点选择

custom_proxy_group=🎭 Claude`select`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)`[]🔰 节点选择

custom_proxy_group=🎬 Muse`select`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)`[]🔰 节点选择

custom_proxy_group=🧠 其它 AI`select`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`(?i)(美国|(^|[^a-zA-Z])US|United States|洛杉矶|Los Angeles|圣何塞|San Jose|西雅图|Seattle|达拉斯|Dallas|纽约|New York|芝加哥|Chicago|迈阿密|Miami|硅谷|Silicon Valley|阿什本|Ashburn|新加坡|狮城|Singapore|(^|[^a-zA-Z])SG)`[]🔰 节点选择

;----------------------------------------------------------
; 四、分流规则（顺序即优先级，AI 规则必须排在 GEOIP,CN 与 FINAL 之前）
;     AI 规则在前，内置规则集通过 !!import: 接在后面
;----------------------------------------------------------
ruleset=🤖 OpenAI,rules/OpenAI.list
ruleset=🎭 Claude,rules/Claude.list
ruleset=🎬 Muse,rules/Muse.list
ruleset=🧠 其它 AI,rules/AI.list

ruleset=!!import:snippets/rulesets.txt
